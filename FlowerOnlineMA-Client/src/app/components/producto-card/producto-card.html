<!-- 1. Tarjeta raíz estirada al 100% de la fila del grid -->
<div class="bg-white rounded-3xl ambient-shadow ambient-shadow-hover overflow-hidden border border-gray-100/80 flex flex-col justify-between group transition-all duration-300 h-full">
  
  <!-- Imagen con altura fija y ajuste object-cover -->
  <div class="relative h-64 w-full shrink-0 overflow-hidden bg-[#F0EEE6]">
    <img 
      [src]="obtenerImagen(producto.rutaImagen)" 
      [alt]="producto.nombre"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
    />
    <span class="absolute top-3 right-3 glass-card text-[#002B18] text-[11px] font-bold px-3 py-1 rounded-full border border-white/50 shadow-sm">
      Stock: {{ producto.stock }}
    </span>
  </div>

  <!-- Detalles con Flexbox creciendo para llenar el espacio -->
  <div class="p-6 flex-1 flex flex-col justify-between">
    <div>
      <span class="text-[11px] font-bold text-[#1C6C3B] uppercase tracking-widest block">
        {{ producto.nombreCategoria || 'Florería' }}
      </span>
      
      <!-- Título: truncado a 1 línea + reserva de altura -->
      <h3 class="text-lg font-bold text-[#002B18] mt-1 line-clamp-1 min-h-[1.75rem] flex items-center group-hover:text-[#1C6C3B] transition-colors">
        {{ producto.nombre }}
      </h3>
      
      <!-- Descripción: truncada a 2 líneas + reserva de altura -->
      <p class="text-gray-500 text-xs mt-2 line-clamp-2 leading-relaxed min-h-[2.5rem]">
        {{ producto.descripcion || 'Arreglo floral diseñado artesanalmente con plantas y flores de alta calidad.' }}
      </p>
    </div>

    <!-- Precios y Acción: anclados al fondo con mt-auto y shrink-0 -->
    <div class="mt-6 flex items-center justify-between pt-4 border-t border-gray-100 shrink-0">
      <div>
        <span class="text-[10px] text-gray-400 uppercase font-bold block">Precio</span>
        <span class="text-2xl font-black text-[#002B18]">
          S/ {{ producto.precio | number:'1.2-2' }}
        </span>
      </div>

      <button 
        (click)="onVerDetalle()"
        class="bg-[#002B18] hover:bg-[#1C6C3B] text-white text-xs font-bold px-4 py-2.5 rounded-full transition-all duration-200 shadow-sm flex items-center gap-1.5 active:scale-95">
        <span>Ver detalle</span>
        <span class="material-symbols-outlined text-sm icon-outline" translate="no">arrow_forward</span>
      </button>
    </div>
  </div>

</div>
